version: 1
cases:
  - name: java-business-chain
    language: java
    fixture: business-chains/java
    expected: {confirmed: 2}
    edges:
      - from: {file: UserController.java, name: create, type_name: UserController}
        to: {file: UserService.java, name: create, type_name: UserService}
      - from: {file: UserService.java, name: create, type_name: UserService}
        to: {file: UserRepository.java, name: save, type_name: UserRepository}
